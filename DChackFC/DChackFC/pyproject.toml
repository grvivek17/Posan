[tool.poetry]
name = "smart-food-court"
version = "0.1.0"
description = "Smart Food Court System with AI Integration"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
djangorestframework = "^3.14"
fastapi = "^0.104"
uvicorn = "^0.24"
sqlalchemy = "^2.0"
alembic = "^1.12"
psycopg2-binary = "^2.9"
pydantic = "^2.4"
pydantic-settings = "^2.0"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
celery = "^5.3"
redis = "^5.0"
websockets = "^12.0"
tensorflow = "^2.14"
scikit-learn = "^1.3"
pandas = "^2.1"
transformers = "^4.34"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3"}
django-oauth-toolkit = "^2.3"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-django = "^4.5"
black = "^23.10"
isort = "^5.12"
flake8 = "^6.1"
mypy = "^1.6"
pre-commit = "^3.5"
factory-boy = "^3.3"
coverage = "^7.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
