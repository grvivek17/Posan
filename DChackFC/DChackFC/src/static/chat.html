<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food Concierge | Smart Food Court</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>🤖 AI Food Concierge</h1>
                <p class="subtitle">Your personal food assistant</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button onclick="window.location.href='/static/preorder.html'"
                    style="padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer;">Order
                    Food</button>
                <button onclick="logout()"
                    style="padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer;">Logout</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Chat Section -->
            <div class="card" style="grid-column: span 2; display: flex; flex-direction: column; height: 600px;">
                <h2>Chat with AI</h2>
                <div id="chat-messages"
                    style="flex: 1; overflow-y: auto; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 0.5rem; margin-bottom: 1rem;">
                    <div class="ai-message"
                        style="margin-bottom: 1rem; padding: 1rem; background: rgba(56, 189, 248, 0.1); border-left: 3px solid var(--accent-color); border-radius: 0.5rem;">
                        <div style="font-weight: 600; margin-bottom: 0.5rem; color: var(--accent-color);">AI Concierge
                        </div>
                        <div>Hello! 👋 I'm your AI Food Concierge. I can help you find the perfect meal based on your
                            preferences, dietary needs, and appetite. What would you like today?</div>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="chat-input" placeholder="Ask me anything about food..."
                        style="flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;"
                        onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()"
                        style="padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; background: linear-gradient(to right, #38bdf8, #818cf8); color: white; font-weight: 600; cursor: pointer;">Send</button>
                </div>

                <!-- Quick Actions -->
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
                    <button onclick="quickMessage('Recommend something healthy')"
                        style="padding: 0.5rem 1rem; border-radius: 0.25rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 0.85rem;">🥗
                        Healthy Options</button>
                    <button onclick="quickMessage('High protein meals')"
                        style="padding: 0.5rem 1rem; border-radius: 0.25rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 0.85rem;">💪
                        High Protein</button>
                    <button onclick="quickMessage('Vegetarian options')"
                        style="padding: 0.5rem 1rem; border-radius: 0.25rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 0.85rem;">🌱
                        Vegetarian</button>
                    <button onclick="quickMessage('Low calorie meals')"
                        style="padding: 0.5rem 1rem; border-radius: 0.25rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 0.85rem;">📉
                        Low Calorie</button>
                </div>
            </div>

            <!-- Recommendations Section -->
            <div class="card">
                <h2>AI Recommendations</h2>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Current
                        Appetite</label>
                    <select id="appetite-select" onchange="getRecommendations()"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;">
                        <option value="moderate">Moderate</option>
                        <option value="light">Light</option>
                        <option value="heavy">Heavy</option>
                    </select>
                </div>

                <div id="recommendations-list" class="metric-container">
                    <div class="loading">Click to get recommendations</div>
                </div>

                <button onclick="getRecommendations()"
                    style="width: 100%; margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; border: none; background: var(--success-color); color: black; font-weight: 600; cursor: pointer;">Get
                    Recommendations</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
    <script src="/static/ai_functions.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/static/login.html';
        }
    </script>
</body>

</html>
